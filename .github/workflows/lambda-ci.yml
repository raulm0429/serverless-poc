name: Lambda CI

on:
  push:
    branches: [master]
    paths:
      - 'lambda/**'
      - '.github/workflows/lambda-ci.yml'

  pull_request:
    branches: [master]
    paths:
      - 'lambda/**'
      - '.github/workflows/lambda-ci.yml'

  workflow_dispatch:

jobs:
  lint:
    name: Lint Python Lambda Functions
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Ruff
        run: pip install ruff

      - name: Run Ruff
        run: ruff check lambda/